name: Refresh air-alert data

# The source CSV is rebuilt once a day, so a daily pass keeps assets/alerts.js close to
# fresh without touching the schedule itself. The job commits only when the generated
# file actually changed.

on:
  schedule:
    - cron: '20 4 * * *' # 04:20 UTC = 07:20 Kyiv (summer) / 06:20 Kyiv (winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: air-alerts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the generator
        run: node --test scripts/build-alerts.test.mjs

      - name: Rebuild assets/alerts.js
        run: node scripts/build-alerts.mjs --refresh

      - name: Commit when the data changed
        run: |
          if git diff --quiet -- assets/alerts.js; then
            echo "Air-alert data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alerts.js
          git commit -m "chore: refresh air-alert history"
          git push
